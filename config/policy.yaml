version: 1
thresholds:
  warn: 0.3
  block: 0.7
weights:
  dictionary: 1.0
  regex: 1.0
  context: 1.0
limits:
  max_bytes: 1048576
  timeout_seconds: 2
on_error: BLOCK
# Empty allow means no allowlist; deny always takes precedence.
# DOCX candidates are validated by the bounded document reader.
file_types:
  allow: [text, pdf, docx]
  deny: [elf, dos_pe, script, zip, gzip, 7z, rar]
sensitive_alerts:
  enabled: true
  mode: rules
  action: WARN
ml_alerts:
  enabled: false
  action: WARN
  model_sha256: 83b9c89e16e2b76f1ef65a367b32b51b11f4d7dd4a675543544d113667201414
rules:
  - id: secret_keywords
    type: dictionary
    category: confidential
    severity: 0.8
    terms: ["коммерческая тайна", "top secret"]
  - id: email
    type: regex
    category: personal
    severity: 0.35
    pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
  - id: project_context
    type: context
    category: internal
    severity: 0.75
    terms: ["проект", "project"]
    context: ["закрытый", "restricted"]
    window: 80
