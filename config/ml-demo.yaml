# ML-only diagnostic policy: no legacy rules.
version: 1
thresholds:
  warn: 0.3
  block: 0.7
weights:
  dictionary: 1.0
  regex: 1.0
  context: 1.0
limits:
  max_bytes: 1048576
  timeout_seconds: 2
on_error: BLOCK
file_types:
  allow:
  - text
  - pdf
  - docx
  deny:
  - elf
  - dos_pe
  - script
  - zip
  - gzip
  - 7z
  - rar
sensitive_alerts:
  enabled: false
  mode: rules
  action: WARN
ml_alerts:
  enabled: true
  action: WARN
  model_sha256: 83b9c89e16e2b76f1ef65a367b32b51b11f4d7dd4a675543544d113667201414
rules: []
