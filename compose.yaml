services:
  central:
    image: dlp-lab-central:0.2.27
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${DLP_BIND_ADDRESS:-127.0.0.1}:${DLP_HTTPS_PORT:-8876}:8766"
    volumes:
      - central-data:/var/lib/dlp-central
      - ./build/docker-tls:/run/tls:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "/app/entrypoint.py", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s
volumes:
  central-data:
